name: Verified browser release
on:
  push:
    tags: ['showcase-*']
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require verified main and a new immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^showcase-[0-9]{4}[.][0-9]{2}[.][0-9]{2}(-[0-9]+)?$ ]]
          refs=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME^{}")
          source=$(printf '%s\n' "$refs" | awk '/\^\{\}$/ {print $1;exit}')
          [[ -n "$source" ]] || source=$(printf '%s\n' "$refs" | awk 'NR==1 {print $1}')
          test "$source" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=success&per_page=1" > "$RUNNER_TEMP/source-ci.json"
          node --input-type=module - "$RUNNER_TEMP/source-ci.json" <<'JS'
          import fs from 'node:fs';
          const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8')).workflow_runs;
          if(!rows.some(r=>r.head_sha===process.env.GITHUB_SHA&&r.head_branch==='main'&&r.conclusion==='success'))process.exit(1);
          JS
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Existing releases are immutable' >&2; exit 1; fi
      - run: npm ci --ignore-scripts
      - run: npm run source:verify
      - run: npm run build
      - run: npm run test:summary
      - run: npm run test:consumer
      - name: Package only the runnable browser closure and licenses
        run: |
          set -euo pipefail
          mkdir release
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib,zipfile
          root=Path('dist');files=[p for p in root.rglob('*') if p.is_file()]
          assert 1<=len(files)<=128
          assert all(not p.is_symlink() and p.stat().st_size<=4*1024**2 for p in files)
          assert sum(p.stat().st_size for p in files)<=16*1024**2
          payload={p.relative_to(root).as_posix():p.read_bytes() for p in files}
          assert {'index.html','BUILD-PROVENANCE.json'}<=payload.keys()
          identity=json.loads(payload['BUILD-PROVENANCE.json'])
          assert identity['sourceCommit']==os.environ['GITHUB_SHA'] and identity['includesWorkingTreeChanges'] is False
          for name in ['LICENSE','README.md']:
              p=Path(name);assert p.is_file() and not p.is_symlink() and p.stat().st_size<=1024**2
              payload[name]=p.read_bytes()
          payload['RUN.md']='# Ordarc 文字记录\n\n解压后在此目录运行 python3 -m http.server 18872，然后打开 http://127.0.0.1:18872/。保存只写当前浏览器及端口的本机存储；更换设备、浏览器或端口前请先导出 JSON。此包仅整理文字，不提供账号、排盘、交易或模型。\n'.encode()
          archive=Path('release/ordarc-notes-browser.zip')
          with zipfile.ZipFile(archive,'x',compression=zipfile.ZIP_DEFLATED) as bundle:
              for name,data in sorted(payload.items()):
                  info=zipfile.ZipInfo('ordarc-notes-browser/'+name,(2020,1,1,0,0,0));info.external_attr=0o100644<<16;info.compress_type=zipfile.ZIP_DEFLATED;bundle.writestr(info,data)
          Path('release/source-manifest.json').write_text(json.dumps({'schema':'ordarc.notes-browser-release/v1','sourceCommit':os.environ['GITHUB_SHA'],'tag':os.environ['GITHUB_REF_NAME'],'artifact':archive.name,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'files':{n:hashlib.sha256(v).hexdigest() for n,v in sorted(payload.items())},'mode':'local notes only; no accounts, calculations, commerce or model connection'},indent=2)+'\n')
          PY
          (cd release && sha256sum *.zip *.json > checksums.txt)
      - name: Attest browser distribution
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release/*.zip
      - name: Publish while preserving desktop Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Existing releases are immutable' >&2; exit 1; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false --title "Ordarc · 本机文字记录 $GITHUB_REF_NAME" --notes '阅读示例→编辑→本机保存与版本对照→JSON/Markdown导出及可取消导入。解压后用python3 -m http.server打开index.html。仅文字记录，无账号、计算引擎、交易或模型连接；保留原桌面Latest。附准确源码身份、校验和与构建来源证明。' release/*
